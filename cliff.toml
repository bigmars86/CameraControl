# git-cliff: next version and release notes from Conventional Commits (used by the release workflow).
# Preview locally: git cliff --bumped-version  /  git cliff --unreleased --bump

[changelog]
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
    { field = "breaking", pattern = "true", group = "<!-- 0 -->Breaking changes" },
    { message = "^feat", group = "<!-- 1 -->Features" },
    { message = "^fix", group = "<!-- 2 -->Bug fixes" },
    { message = "^perf", group = "<!-- 3 -->Performance" },
    { message = ".*", skip = true },
]
protect_breaking_commits = true
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"

[bump]
initial_tag = "v1.0.0"
features_always_bump_minor = true
breaking_always_bump_major = true
