name: Build

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build CameraControl.exe
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ps2exe
        shell: powershell
        run: Install-Module ps2exe -RequiredVersion 1.0.18 -Scope CurrentUser -Force

      - name: Build
        shell: powershell
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = if ($env:REF_TYPE -eq 'tag') { $env:REF_NAME.TrimStart('v') } else { '0.0.0' }
          .\build.ps1 -Version $version
          $hash = (Get-FileHash CameraControl.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content CameraControl.exe.sha256 "$hash  CameraControl.exe" -Encoding ascii

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CameraControl
          path: |
            CameraControl.exe
            CameraControl.exe.sha256
          if-no-files-found: error

  release:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the build provenance
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: CameraControl

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: CameraControl.exe

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$TAG" CameraControl.exe CameraControl.exe.sha256
          --repo "$GITHUB_REPOSITORY" --title "CameraControl $TAG" --generate-notes --verify-tag
