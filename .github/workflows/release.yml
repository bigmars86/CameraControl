name: Release

# Run manually on main. The version follows from the Conventional Commits since the last release
# (fix -> patch, feat -> minor, breaking change -> major; the first release is 1.0.0) and the
# release notes are generated from them, see cliff.toml.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release to rebuild, sign and replace (e.g. v1.0.0). Leave empty for a new release.
        required: false
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Version and release notes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install git-cliff
        run: python -m pip install -r requirements-dev.txt

      - name: Determine version
        id: version
        env:
          EXISTING_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$EXISTING_TAG" ]; then
            commit=$(git rev-parse --verify --quiet "refs/tags/$EXISTING_TAG^{commit}") || {
              echo "::error::Tag $EXISTING_TAG does not exist"
              exit 1
            }
            tag=$EXISTING_TAG
            new=false
          else
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::New releases are made from main"
              exit 1
            fi
            tag=$(git cliff --bumped-version)
            if git rev-parse --verify --quiet "refs/tags/$tag" > /dev/null; then
              echo "::error::No feat, fix or perf commits since $tag: nothing to release"
              exit 1
            fi
            commit=$GITHUB_SHA
            new=true
            git cliff --unreleased --tag "$tag" --strip all > release-notes.md
            printf '\nCode signing policy: %s/%s#code-signing-policy\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" >> release-notes.md
          fi
          version=${tag#v}
          if ! [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $tag does not look like vX.Y.Z"
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "commit=$commit"
            echo "new=$new"
          } >> "$GITHUB_OUTPUT"
          echo "Release $tag from $commit (new release: $new)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release notes
        if: steps.version.outputs.new == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  build:
    name: Build
    needs: prepare
    uses: $/.github/workflows/build.yml
    permissions:
      contents: read
    with:
      ref: ${{ needs.prepare.outputs.commit }}
      version: ${{ needs.prepare.outputs.version }}

  sign:
    name: Sign (SignPath)
    # Skipped until the SignPath project is configured, see CONTRIBUTING.md
    if: vars.SIGNPATH_ORGANIZATION_ID != ''
    needs: [prepare, build]
    runs-on: windows-latest
    permissions:
      actions: read # SignPath downloads the unsigned artifact with this job's token
      contents: read
    steps:
      - name: Submit signing request (waits for approval in SignPath)
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed
          parameters: |
            version: ${{ toJSON(format('{0}.0', needs.prepare.outputs.version)) }}

      - name: Verify signature
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature signed\CameraControl.exe
          if ($sig.Status -ne 'Valid') { throw "Signature status: $($sig.Status)" }
          $sig.SignerCertificate.Subject

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CameraControl-signed
          path: signed/CameraControl.exe
          if-no-files-found: error

  publish:
    name: Publish release
    # Unsigned only while signing is not configured (sign skipped), never after a failed signing
    if: >-
      !cancelled() && needs.build.result == 'success' &&
      (needs.sign.result == 'success' || needs.sign.result == 'skipped')
    needs: [prepare, build, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the release
      id-token: write # sign the build provenance
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.sign.result == 'success' && 'CameraControl-signed' || 'CameraControl' }}

      - name: Download release notes
        if: needs.prepare.outputs.new == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes

      - name: Checksum
        run: sha256sum CameraControl.exe | tee CameraControl.exe.sha256

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: CameraControl.exe

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
          NEW: ${{ needs.prepare.outputs.new }}
        run: |
          if [ "$NEW" = true ]; then
            gh release create "$TAG" CameraControl.exe CameraControl.exe.sha256 --repo "$GITHUB_REPOSITORY" \
              --target "$COMMIT" --title "CameraControl $TAG" --notes-file release-notes.md
          else
            gh release upload "$TAG" CameraControl.exe CameraControl.exe.sha256 --repo "$GITHUB_REPOSITORY" --clobber
          fi
