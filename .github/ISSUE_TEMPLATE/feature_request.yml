name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How could it work?
  - type: input
    id: camera
    attributes:
      label: Camera model (if relevant)
